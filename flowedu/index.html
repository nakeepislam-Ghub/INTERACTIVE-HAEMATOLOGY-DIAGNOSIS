\u0645\u0646 \u0633\u0646\u0629: \u0625\u064A\u062C\u0627\u0628\u064A\u0629 \u0642\u0648\u064A\u0629 \u0644\u0640 CD19 \u0645\u0639 cCD79a \u0648 cCD22 \u0648 TdT\u060C \u0648\u0644\u0643\u0646 \u0633\u0644\u0628\u064A\u0629 \u062A\u0627\u0645\u0629 \u0644\u0640 CD10 (CALLA Negative). \u062A\u0631\u062A\u0628\u0637 \u063A\u0627\u0644\u0628\u0627\u064B \u0628\u0637\u0641\u0631\u0629 \u0627\u0644\u062C\u064A\u0646 KMT2A (MLL) t(4;11).",pearl:"\u0627\u0644\u0640 Pro-B ALL \u062A\u0643\u0648\u0646 CD19+ \u0648 cCD79a+ \u0648\u0644\u0643\u0646 CD10 \u0633\u0644\u0628\u064A \u062A\u0645\u0627\u0645\u0627\u064B."},"case-6":{summary:"\u062D\u0627\u0644\u0629 Mature B-ALL / Burkitt Leukemia (B-IV): \u062E\u0644\u0627\u064A\u0627 L3 \u0630\u0627\u062A \u0641\u062C\u0648\u0627\u062A \u062F\u0647\u0646\u064A\u0629 \u0648\u0627\u0636\u062D\u0629 \u0648\u0645\u062A\u0644\u0627\u0632\u0645\u0629 \u062A\u062D\u0644\u0644 \u0627\u0644\u0648\u0631\u0645 (TLS). \u0627\u062E\u062A\u0641\u062A \u0645\u0646\u0647\u0627 \u062F\u0644\u0627\u0644\u0627\u062A \u0627\u0644\u062E\u0644\u0627\u064A\u0627 \u0627\u0644\u0628\u062F\u0627\u0626\u064A\u0629 (TdT \u0633\u0644\u0628\u064A \u0648 CD34 \u0633\u0644\u0628\u064A) \u0648\u0627\u0643\u062A\u0633\u0628\u062A CD20 \u0642\u0648\u064A \u0648 Surface IgM \u0645\u0639 \u062A\u0642\u064A\u064A\u062F \u0623\u062D\u0627\u062F\u064A \u0627\u0644\u0646\u0633\u064A\u0644\u0629 \u0644\u0633\u0644\u0633\u0644\u0629 Kappa.",pearl:"\u0627\u0644\u0640 Mature B-ALL (Burkitt) \u062A\u062A\u0645\u064A\u0632 \u0628\u0633\u0644\u0628\u064A\u0629 TdT \u0648 CD34 \u0645\u0639 \u0625\u064A\u062C\u0627\u0628\u064A\u0629 \u0627\u0644\u0640 Surface IgM \u0648\u062A\u0642\u064A\u064A\u062F \u0627\u0644\u0640 Light Chain."},"case-7":{summary:"\u062D\u0627\u0644\u0629 \u0644\u0648\u0643\u064A\u0645\u064A\u0627 \u0645\u062E\u062A\u0644\u0637\u0629 \u0627\u0644\u0646\u0645\u0637 \u0627\u0644\u0638\u0627\u0647\u0631\u064A (B/Myeloid MPAL Biphenotypic): \u0646\u0641\u0633 \u062A\u062C\u0645\u0639 \u0627\u0644\u0640 Blasts \u064A\u062D\u0642\u0642 \u0634\u0631\u0648\u0637 \u0627\u0644\u0640 WHO \u0627\u0644\u0643\u0627\u0645\u0644\u0629 \u0644\u0644\u0640 B-Lineage (CD19 \u0642\u0648\u064A + cCD79a \u0648 CD10) \u0648\u0634\u0631\u0648\u0637 \u0627\u0644\u0640 Myeloid \u0627\u0644\u0643\u0627\u0645\u0644\u0629 (cMPO \u0625\u064A\u062C\u0627\u0628\u064A \u0642\u0648\u064A) \u0641\u064A \u0622\u0646 \u0648\u0627\u062D\u062F.",pearl:"\u0644\u0627 \u062A\u0634\u062E\u0635 MPAL \u0628\u0645\u062C\u0631\u062F \u0648\u062C\u0648\u062F CD13 \u0623\u0648 CD33 \u0639\u0627\u0628\u0631\u060C \u0628\u0644 \u064A\u062C\u0628 \u062A\u062D\u0642\u0642 \u0634\u0631\u0648\u0637 \u0627\u0644\u0640 WHO \u0627\u0644\u0643\u0627\u0645\u0644\u0629 \u0644\u0643\u0644\u0627 \u0627\u0644\u0633\u0644\u0627\u0644\u062A\u064A\u0646 (\u0645\u062B\u0644 CD19+cCD79a \u0645\u0639 cMPO)."},"case-8":{summary:"\u0646\u062E\u0627\u0639 \u0639\u0638\u0645 \u0645\u062A\u062C\u062F\u062F \u0637\u0628\u064A\u0639\u064A (Regenerating Bone Marrow Hematogones): \u064A\u0638\u0647\u0631 \u0645\u0633\u0627\u0631 \u0646\u0636\u062C \u0645\u062A\u0635\u0644 \u0648\u0645\u062A\u062F\u0631\u062C \u064A\u0628\u062F\u0623 \u0645\u0646 Stage 1 (CD34+ / CD10 bright / CD20-) \u0648\u064A\u0646\u0633\u0627\u0628 \u0628\u0633\u0644\u0627\u0633\u0629 \u0625\u0644\u0649 Stage 2/3 (\u0641\u0642\u062F\u0627\u0646 CD34 \u0648\u0627\u0643\u062A\u0633\u0627\u0628 CD20 \u062A\u062F\u0631\u064A\u062C\u064A\u0627\u064B \u0648\u0627\u0631\u062A\u0641\u0627\u0639 CD45) \u0645\u0639 CD58 \u0637\u0628\u064A\u0639\u064A \u063A\u064A\u0631 \u0645\u0631\u062A\u0641\u0639.",pearl:"\u0627\u0644\u0640 Hematogones \u062A\u0638\u0647\u0631 \u0643\u0634\u0631\u064A\u0637 \u0646\u0636\u062C \u0645\u062A\u0635\u0644 \u0628\u062F\u0648\u0646 \u062A\u0648\u0642\u0641 (No maturation arrest)\u060C \u0628\u064A\u0646\u0645\u0627 \u0627\u0644\u0640 B-ALL \u062A\u062A\u062C\u0645\u0639 \u0643\u0643\u062A\u0644\u0629 \u0645
