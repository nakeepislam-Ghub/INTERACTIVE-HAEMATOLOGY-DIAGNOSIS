<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" width="860" height="580" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif">
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b3540"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3223a"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f7d4f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d5fa8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8700f"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b3f8c"/></marker></defs>
<rect width="860" height="580" fill="#fff"/>
<text x="430" y="34.0" font-size="20" font-weight="700" fill="#1d1a24" text-anchor="middle">The iron cycle</text>
<text x="430" y="56.0" font-size="13.5" font-weight="400" fill="#5d5663" text-anchor="middle">Daily iron flows in an adult. Almost all iron is recycled; only 1–2 mg a day is absorbed and lost.</text>
<ellipse cx="430" cy="320" rx="130" ry="62" fill="#fbeccb" stroke="#a8700f" stroke-width="1.5"/>
<text x="430" y="308.0" font-size="17" font-weight="700" fill="#a8700f" text-anchor="middle">Plasma transferrin</text>
<text x="430" y="330.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">about 3 mg (turns over</text>
<text x="430" y="347.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">6–8 times a day)</text>
<rect x="330" y="92" width="200" height="74" rx="12" fill="#e3f1e8" stroke="#2f7d4f" stroke-width="1.5"/>
<text x="430.0" y="120.0" font-size="16" font-weight="700" fill="#2f7d4f" text-anchor="middle">Duodenum</text>
<text x="430.0" y="142.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">absorbs 1–2 mg/day</text>
<rect x="40" y="260" width="190" height="120" rx="12" fill="#e3eaf6" stroke="#3d5fa8" stroke-width="1.5"/>
<text x="135.0" y="288.0" font-size="16" font-weight="700" fill="#3d5fa8" text-anchor="middle">Liver</text>
<text x="135.0" y="310.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">stores ~1 g</text>
<text x="135.0" y="326.2" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">(ferritin, haemosiderin)</text>
<rect x="630" y="260" width="190" height="120" rx="12" fill="#f6d9dd" stroke="#a3223a" stroke-width="1.5"/>
<text x="725.0" y="288.0" font-size="16" font-weight="700" fill="#a3223a" text-anchor="middle">Bone marrow</text>
<text x="725.0" y="310.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">erythroblasts take up</text>
<text x="725.0" y="326.2" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">20–25 mg/day</text>
<rect x="630" y="464" width="190" height="96" rx="12" fill="#f6d9dd" stroke="#a3223a" stroke-width="1.5"/>
<text x="725.0" y="492.0" font-size="16" font-weight="700" fill="#a3223a" text-anchor="middle">Red cells</text>
<text x="725.0" y="514.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">~2.5 g in haemoglobin;</text>
<text x="725.0" y="530.2" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">live about 120 days</text>
<rect x="330" y="474" width="200" height="86" rx="12" fill="#e9e2f4" stroke="#5b3f8c" stroke-width="1.5"/>
<text x="430.0" y="502.0" font-size="16" font-weight="700" fill="#5b3f8c" text-anchor="middle">Spleen macrophages</text>
<text x="430.0" y="524.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">recycle 20–25 mg/day</text>
<text x="430.0" y="540.2" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">from old red cells</text>
<rect x="40" y="474" width="190" height="86" rx="12" fill="#f1eff2" stroke="#5d5663" stroke-width="1.5"/>
<text x="135.0" y="502.0" font-size="16" font-weight="700" fill="#5d5663" text-anchor="middle">Losses</text>
<text x="135.0" y="524.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">1–2 mg/day: gut cells,</text>
<text x="135.0" y="540.2" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">skin, menstruation</text>
<text x="430" y="82.0" font-size="13" font-weight="700" fill="#5d5663" text-anchor="middle">Diet: 10–20 mg/day</text>
<path d="M430 166 L430 256" fill="none" stroke="#2f7d4f" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="442" y="214.0" font-size="13" font-weight="700" fill="#2f7d4f" text-anchor="start">1–2 mg</text>
<path d="M560 312 L626 312" fill="none" stroke="#a3223a" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="593" y="302.0" font-size="12.5" font-weight="700" fill="#a3223a" text-anchor="middle">20–25 mg</text>
<path d="M725 380 L725 460" fill="none" stroke="#a3223a" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="737" y="426.0" font-size="12.5" font-weight="400" fill="#a3223a" text-anchor="start">new red cells</text>
<path d="M626 512 L534 512" fill="none" stroke="#5b3f8c" stroke-width="2.5" marker-end="url(#ap)"/>
<text x="580" y="502.0" font-size="12.5" font-weight="400" fill="#5b3f8c" text-anchor="middle">old cells</text>
<path d="M430 474 L430 384" fill="none" stroke="#5b3f8c" stroke-width="2.5" marker-end="url(#ap)"/>
<text x="442" y="436.0" font-size="13" font-weight="700" fill="#5b3f8c" text-anchor="start">20–25 mg</text>
<path d="M300 300 L234 300" fill="none" stroke="#3d5fa8" stroke-width="2" marker-end="url(#ab)"/>
<path d="M234 338 L300 338" fill="none" stroke="#3d5fa8" stroke-width="2" marker-end="url(#ab)"/>
<text x="267" y="292.0" font-size="12" font-weight="400" fill="#3d5fa8" text-anchor="middle">store</text>
<text x="267" y="356.0" font-size="12" font-weight="400" fill="#3d5fa8" text-anchor="middle">release</text>
<path d="M340 360 L236 476" fill="none" stroke="#3b3540" stroke-width="1.6" marker-end="url(#ak)" stroke-dasharray="4 3"/>
<text x="262" y="420.0" font-size="12" font-weight="400" fill="#5d5663" text-anchor="end">losses</text>
</svg>