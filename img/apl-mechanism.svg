<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif">
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b3540"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3223a"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f7d4f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d5fa8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8700f"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b3f8c"/></marker></defs>
<rect width="900" height="520" fill="#fff"/>
<text x="450" y="34.0" font-size="20" font-weight="700" fill="#1d1a24" text-anchor="middle">Acute promyelocytic leukaemia: t(15;17) and how ATRA works</text>
<text x="450" y="56.0" font-size="13.5" font-weight="400" fill="#5d5663" text-anchor="middle">The PML::RARA fusion locks retinoic acid target genes, so cells stop at the promyelocyte stage.</text>
<rect x="60" y="90" width="26" height="170" rx="12" fill="#e3eaf6" stroke="#1d1a24" stroke-width="1.2"/>
<rect x="60" y="90" width="26" height="170" rx="12" fill="#e3eaf6" stroke="#1d1a24" stroke-width="1.2"/>
<text x="73" y="280.0" font-size="13" font-weight="700" fill="#1d1a24" text-anchor="middle">15</text>
<rect x="60" y="200" width="26" height="12" fill="#3d5fa8"/>
<text x="73" y="84.0" font-size="11" font-weight="700" fill="#3d5fa8" text-anchor="middle" letter-spacing="1.5">PML</text>
<rect x="120" y="100" width="26" height="150" rx="12" fill="#fbeccb" stroke="#1d1a24" stroke-width="1.2"/>
<rect x="120" y="100" width="26" height="150" rx="12" fill="#fbeccb" stroke="#1d1a24" stroke-width="1.2"/>
<text x="133" y="270.0" font-size="13" font-weight="700" fill="#1d1a24" text-anchor="middle">17</text>
<rect x="120" y="150" width="26" height="12" fill="#a8700f"/>
<text x="133" y="94.0" font-size="11" font-weight="700" fill="#a8700f" text-anchor="middle" letter-spacing="1.5">RARA</text>
<path d="M170 175 L230 175" fill="none" stroke="#3b3540" stroke-width="2.2" marker-end="url(#ak)"/>
<text x="200" y="165.0" font-size="12" font-weight="700" fill="#5d5663" text-anchor="middle">t(15;17)</text>
<rect x="245" y="150" width="190" height="48" rx="10" fill="#e9e2f4" stroke="#5b3f8c" stroke-width="1.3"/>
<rect x="245" y="150" width="95" height="48" rx="10" fill="#e3eaf6" stroke="#3d5fa8"/>
<rect x="340" y="150" width="95" height="48" rx="10" fill="#fbeccb" stroke="#a8700f"/>
<text x="292" y="179.0" font-size="14" font-weight="700" fill="#3d5fa8" text-anchor="middle">PML</text>
<text x="388" y="179.0" font-size="14" font-weight="700" fill="#a8700f" text-anchor="middle">RARA</text>
<text x="340" y="222.0" font-size="13" font-weight="700" fill="#5b3f8c" text-anchor="middle">PML::RARA fusion protein</text>
<text x="340" y="242.0" font-size="11.5" font-weight="400" fill="#5d5663" text-anchor="middle">bcr1 (intron 6), bcr2 (exon 6), bcr3 (intron 3)</text>
<rect x="470" y="82" width="410" height="190" rx="12" fill="#f6d9dd" stroke="#a3223a" stroke-width="1.3"/>
<text x="675" y="106.0" font-size="15" font-weight="700" fill="#a3223a" text-anchor="middle">Without treatment</text>
<rect x="500" y="150" width="350" height="18" fill="#e7dfd3" stroke="#b8b1bd"/>
<text x="675" y="190.0" font-size="12.5" font-weight="700" fill="#1d1a24" text-anchor="middle">retinoic acid target genes OFF</text>
<rect x="560" y="124" width="90" height="30" rx="8" fill="#e9e2f4" stroke="#5b3f8c" stroke-width="1.3"/>
<text x="605" y="144.0" font-size="11.5" font-weight="700" fill="#5b3f8c" text-anchor="middle">PML::RARA</text>
<rect x="660" y="124" width="96" height="30" rx="8" fill="#fff" stroke="#1d1a24" stroke-width="1.3"/>
<text x="708" y="144.0" font-size="11.5" font-weight="700" fill="#1d1a24" text-anchor="middle">co-repressor</text>
<text x="675" y="214.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">Maturation blocked at the promyelocyte</text>
<text x="675" y="232.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">Granules release tissue factor and annexin II</text>
<text x="675" y="252.0" font-size="13" font-weight="700" fill="#a3223a" text-anchor="middle">→ DIC with hyperfibrinolysis, early bleeding deaths</text>
<rect x="20" y="300" width="860" height="200" rx="12" fill="#e3f1e8" stroke="#2f7d4f" stroke-width="1.3"/>
<text x="450" y="326.0" font-size="15" font-weight="700" fill="#2f7d4f" text-anchor="middle">With ATRA and arsenic trioxide</text>
<rect x="38" y="344" width="144" height="92" rx="10" fill="#fff" stroke="#2f7d4f" stroke-width="1.3"/>
<text x="110" y="370.0" font-size="14" font-weight="700" fill="#2f7d4f" text-anchor="middle">ATRA</text>
<text x="110" y="392.0" font-size="12" font-weight="400" fill="#1d1a24" text-anchor="middle">binds RARA,</text>
<text x="110" y="410.0" font-size="12" font-weight="400" fill="#1d1a24" text-anchor="middle">releases co-repressor</text>
<circle cx="195" cy="390" r="11" fill="#fff" stroke="#2f7d4f" stroke-width="2"/><path d="M189.5 390H200.5M195 384.5V395.5" stroke="#2f7d4f" stroke-width="2.4"/>
<rect x="208" y="344" width="144" height="92" rx="10" fill="#fff" stroke="#2f7d4f" stroke-width="1.3"/>
<text x="280" y="370.0" font-size="14" font-weight="700" fill="#2f7d4f" text-anchor="middle">Arsenic (ATO)</text>
<text x="280" y="392.0" font-size="12" font-weight="400" fill="#1d1a24" text-anchor="middle">degrades PML::RARA</text>
<text x="280" y="410.0" font-size="12" font-weight="400" fill="#1d1a24" text-anchor="middle">via the PML part</text>
<path d="M354 390 L376 390" fill="none" stroke="#2f7d4f" stroke-width="1.8" marker-end="url(#ag)"/>
<rect x="378" y="344" width="144" height="92" rx="10" fill="#fff" stroke="#2f7d4f" stroke-width="1.3"/>
<text x="450" y="370.0" font-size="14" font-weight="700" fill="#2f7d4f" text-anchor="middle">Genes ON</text>
<text x="450" y="392.0" font-size="12" font-weight="400" fill="#1d1a24" text-anchor="middle">differentiation</text>
<text x="450" y="410.0" font-size="12" font-weight="400" fill="#1d1a24" text-anchor="middle">resumes</text>
<path d="M524 390 L546 390" fill="none" stroke="#2f7d4f" stroke-width="1.8" marker-end="url(#ag)"/>
<rect x="548" y="344" width="144" height="92" rx="10" fill="#fff" stroke="#2f7d4f" stroke-width="1.3"/>
<text x="620" y="370.0" font-size="14" font-weight="700" fill="#2f7d4f" text-anchor="middle">Promyelocytes</text>
<text x="620" y="392.0" font-size="12" font-weight="400" fill="#1d1a24" text-anchor="middle">mature into</text>
<text x="620" y="410.0" font-size="12" font-weight="400" fill="#1d1a24" text-anchor="middle">neutrophils</text>
<path d="M694 390 L716 390" fill="none" stroke="#2f7d4f" stroke-width="1.8" marker-end="url(#ag)"/>
<rect x="718" y="344" width="144" height="92" rx="10" fill="#fff" stroke="#2f7d4f" stroke-width="1.3"/>
<text x="790" y="370.0" font-size="14" font-weight="700" fill="#2f7d4f" text-anchor="middle">Cure</text>
<text x="790" y="392.0" font-size="12" font-weight="400" fill="#1d1a24" text-anchor="middle">in over 90%</text>
<text x="790" y="410.0" font-size="12" font-weight="400" fill="#1d1a24" text-anchor="middle">of patients</text>
<text x="450" y="462.0" font-size="13.5" font-weight="700" fill="#1d1a24" text-anchor="middle">Start ATRA as soon as APL is suspected on the film, before genetic confirmation.</text>
<text x="450" y="482.0" font-size="12" font-weight="400" fill="#5d5663" text-anchor="middle">Watch for differentiation syndrome (fever, dyspnoea, pulmonary infiltrates, weight gain): treat with dexamethasone.</text>
</svg>