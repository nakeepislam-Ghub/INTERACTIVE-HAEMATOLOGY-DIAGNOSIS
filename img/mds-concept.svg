<circle cx="464" cy="170" r="7.15" fill="#8e5bb8"/>
<text x="450" y="198.0" font-size="12.5" font-weight="700" fill="#5b3f8c" text-anchor="middle">clone expands: hypercellular marrow</text>
<path d="M450 206 L370 234" fill="none" stroke="#5b3f8c" stroke-width="1.6" marker-end="url(#ap)"/>
<circle cx="370" cy="254" r="15" fill="#d9485f" stroke="#8d8693" stroke-width="1.3"/>
