<circle cx="210" cy="246" r="15" fill="#c79be0" stroke="#8d8693" stroke-width="1.3"/>
<text x="140" y="290.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">red cells, white cells,</text>
<text x="140" y="308.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">platelets in balance</text>
