<text x="450" y="106.0" font-size="15.5" font-weight="700" fill="#5b3f8c" text-anchor="middle">MDS stem cell clone</text>
<rect x="630" y="80" width="260" height="330" rx="14" fill="#f6d9dd" stroke="#a3223a" stroke-width="1.4"/>
<text x="760" y="106.0" font-size="15.5" font-weight="700" fill="#a3223a" text-anchor="middle">Acute myeloid leukaemia</text>
<circle cx="140" cy="150" r="18" fill="#bcd7c3" stroke="#2f7d4f" stroke-width="1.3"/>
<circle cx="140" cy="150" r="9.9" fill="#2f7d4f"/>
