<circle cx="820" cy="224" r="8.25" fill="#a3223a"/>
<text x="760" y="292.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">maturation blocked,</text>
<text x="760" y="310.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">blasts take over</text>
<rect x="712.72" y="339" width="94.55999999999999" height="22" rx="11" fill="#fff" stroke="#a3223a" stroke-width="1.1"/>
<text x="760" y="354.3" font-size="12" font-weight="700" fill="#a3223a" text-anchor="middle">blasts ≥20%</text>
<rect x="20" y="430" width="860" height="52" rx="10" fill="#f1eff2" stroke="#b8b1bd" stroke-width="1.3"/>
<text x="450" y="452.0" font-size="13.5" font-weight="700" fill="#1d1a24" text-anchor="middle">Blasts climb across the spectrum: &lt;5% marrow (low blasts) → 5–19% (increased blasts) → ≥20% (AML).</text>
<text x="450" y="472.0" font-size="12.5" font-weight="400" fill="#5d5663" text-anchor="middle">Other mechanisms: immune attack (hypoplastic MDS), angiogenesis (VEGF), poor growth-factor response.</text>
</svg>