<text x="450" y="292.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">dysplastic precursors die by</text>
<text x="450" y="310.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">apoptosis (TNF-α, FAS, TRAIL)</text>
<rect x="347.04" y="339" width="205.92" height="22" rx="11" fill="#fff" stroke="#5b3f8c" stroke-width="1.1"/>
<text x="450" y="354.3" font-size="12" font-weight="700" fill="#5b3f8c" text-anchor="middle">cytopenias + dysplasia ≥10%</text>
<path d="M582 240 L626 240" fill="none" stroke="#a3223a" stroke-width="2.4" marker-end="url(#ar)"/>
<text x="604" y="226.0" font-size="11.5" font-weight="700" fill="#a3223a" text-anchor="middle">more hits</text>
