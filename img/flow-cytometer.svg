<text x="450" y="34.0" font-size="20" font-weight="700" fill="#1d1a24" text-anchor="middle">How a flow cytometer works</text>
<text x="450" y="56.0" font-size="13.5" font-weight="400" fill="#5d5663" text-anchor="middle">Fluidics line the cells up, optics read the light, electronics turn it into numbers.</text>
<text x="30" y="96.0" font-size="11.5" font-weight="700" fill="#3d5fa8" text-anchor="start" letter-spacing="1.5">1  FLUIDICS</text>
<text x="300" y="96.0" font-size="11.5" font-weight="700" fill="#a3223a" text-anchor="start" letter-spacing="1.5">2  OPTICS</text>
<text x="680" y="96.0" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start" letter-spacing="1.5">3  ELECTRONICS</text>
