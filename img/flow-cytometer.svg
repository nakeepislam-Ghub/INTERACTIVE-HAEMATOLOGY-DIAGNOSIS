<text x="321" y="562.0" font-size="13" font-weight="700" fill="#1d1a24" text-anchor="start">Optical filters</text>
<text x="321" y="586.0" font-size="12" font-weight="700" fill="#a3223a" text-anchor="start">Long pass</text>
<text x="423" y="586.0" font-size="12" font-weight="400" fill="#1d1a24" text-anchor="start">passes light above a cut-off</text>
<text x="321" y="607.0" font-size="12" font-weight="700" fill="#a3223a" text-anchor="start">Short pass</text>
<text x="423" y="607.0" font-size="12" font-weight="400" fill="#1d1a24" text-anchor="start">passes light below a cut-off</text>
<text x="321" y="628.0" font-size="12" font-weight="700" fill="#a3223a" text-anchor="start">Band pass (BP)</text>
<text x="423" y="628.0" font-size="12" font-weight="400" fill="#1d1a24" text-anchor="start">passes a narrow band, e.g. 530/30</text>
<text x="321" y="649.0" font-size="12" font-weight="700" fill="#a3223a" text-anchor="start">Dichroic</text>
<text x="423" y="649.0" font-size="12" font-weight="400" fill="#1d1a24" text-anchor="start">angled: passes some colours, reflects the rest</text>
<rect x="690" y="200" width="180" height="58" rx="10" fill="#e3f1e8" stroke="#2f7d4f" stroke-width="1.3"/>
<text x="780" y="224.0" font-size="13" font-weight="700" fill="#2f7d4f" text-anchor="middle">Photons → electrons</text>
<text x="780" y="242.0" font-size="11.5" font-weight="400" fill="#1d1a24" text-anchor="middle">voltage pulse per cell</text>
<rect x="690" y="290" width="180" height="58" rx="10" fill="#e3f1e8" stroke="#2f7d4f" stroke-width="1.3"/>
<text x="780" y="314.0" font-size="13" font-weight="700" fill="#2f7d4f" text-anchor="middle">ADC</text>
<text x="780" y="332.0" font-size="11.5" font-weight="400" fill="#1d1a24" text-anchor="middle">analogue → digital value</text>
