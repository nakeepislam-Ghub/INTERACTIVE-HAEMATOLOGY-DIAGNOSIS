<text x="170" y="501.0" font-size="12" font-weight="400" fill="#1d1a24" text-anchor="start">Hydrodynamic focusing:</text>
<text x="170" y="516.0" font-size="12" font-weight="400" fill="#1d1a24" text-anchor="start">cells pass in single file</text>
<text x="170" y="580.0" font-size="11.5" font-weight="400" fill="#5d5663" text-anchor="start">Two cells in the beam</text>
<text x="170" y="594.4" font-size="11.5" font-weight="400" fill="#5d5663" text-anchor="start">together = coincident</text>
<text x="170" y="608.8" font-size="11.5" font-weight="400" fill="#5d5663" text-anchor="start">event (lost data)</text>
