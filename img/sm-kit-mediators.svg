<path d="M274.0 326 V346" stroke="#3b3540" stroke-width="1.6"/>
<path d="M450.0 326 V346" stroke="#3b3540" stroke-width="1.6"/>
<path d="M626.0 326 V346" stroke="#3b3540" stroke-width="1.6"/>
<text x="450" y="492.0" font-size="13" font-weight="400" fill="#5d5663" text-anchor="middle">Serum tryptase reflects mast cell burden: >20 ng/mL is a minor criterion; ≥200 ng/mL is a B finding.</text>
</svg>