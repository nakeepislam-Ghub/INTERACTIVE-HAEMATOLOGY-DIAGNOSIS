<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif">
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b3540"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3223a"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f7d4f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d5fa8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8700f"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b3f8c"/></marker></defs>
<rect width="900" height="510" fill="#fff"/>
<text x="450" y="34.0" font-size="20" font-weight="700" fill="#1d1a24" text-anchor="middle">Systemic mastocytosis: from KIT mutation to symptoms</text>
<rect x="40" y="150" width="330" height="26" fill="#f2c9a8" stroke="#b07a4a"/>
<text x="190" y="142.0" font-size="10.5" font-weight="700" fill="#8a5a2b" text-anchor="middle" letter-spacing="1.5">MEMBRANE</text>
<path d="M102 120 v30 M118 120 v30" stroke="#7aa57f" stroke-width="7" stroke-linecap="round"/><rect x="96" y="176" width="28" height="40" rx="6" fill="#7aa57f" opacity=".85"/>
<path d="M262 120 v30 M278 120 v30" stroke="#a3223a" stroke-width="7" stroke-linecap="round"/><rect x="256" y="176" width="28" height="40" rx="6" fill="#a3223a" opacity=".85"/>
<circle cx="292" cy="184" r="5" fill="#a8700f"/><text x="292" y="188" font-size="7" text-anchor="middle" fill="#fff" font-weight="700">P</text>
<circle cx="292" cy="196" r="5" fill="#a8700f"/><text x="292" y="200" font-size="7" text-anchor="middle" fill="#fff" font-weight="700">P</text>
<circle cx="292" cy="208" r="5" fill="#a8700f"/><text x="292" y="212" font-size="7" text-anchor="middle" fill="#fff" font-weight="700">P</text>
<circle cx="110" cy="108" r="11" fill="#c9b6e4" stroke="#5b3f8c"/>
<text x="110" y="90.0" font-size="12" font-weight="700" fill="#5d5663" text-anchor="middle">SCF needed</text>
<text x="110" y="240.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">Normal KIT: signals</text>
<text x="110" y="256.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">only when SCF binds</text>
<text x="270" y="240.0" font-size="12.5" font-weight="700" fill="#a3223a" text-anchor="middle">KIT D816V (≈90%):</text>
<text x="270" y="256.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">always on, no SCF needed</text>
<path d="M370 200 L440 200" fill="none" stroke="#a3223a" stroke-width="2.4" marker-end="url(#ar)"/>
<rect x="446" y="140" width="190" height="120" rx="12" fill="#f6d9dd" stroke="#a3223a" stroke-width="1.3"/>
<text x="541" y="166.0" font-size="15" font-weight="700" fill="#a3223a" text-anchor="middle">Clonal mast cells</text>
<text x="541" y="192.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">proliferate, survive</text>
<text x="541" y="212.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">and accumulate in</text>
<text x="541" y="232.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">marrow, skin, organs</text>
<path d="M636 200 L690 200" fill="none" stroke="#3b3540" stroke-width="2.2" marker-end="url(#ak)"/>
<rect x="696" y="96" width="180" height="208" rx="12" fill="#fbeccb" stroke="#a8700f" stroke-width="1.3"/>
<text x="786" y="122.0" font-size="14" font-weight="700" fill="#a8700f" text-anchor="middle">Mediators released</text>
<text x="786" y="148.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">histamine</text>
<text x="786" y="172.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">tryptase</text>
<text x="786" y="196.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">prostaglandin D₂</text>
<text x="786" y="220.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">leukotrienes</text>
<text x="786" y="244.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">heparin</text>
<text x="786" y="268.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">cytokines (IL-6, TNF)</text>
<rect x="18.0" y="350" width="160" height="110" rx="12" fill="#e9e2f4" stroke="#5b3f8c" stroke-width="1.4"/>
<text x="98.0" y="376.0" font-size="14.5" font-weight="700" fill="#5b3f8c" text-anchor="middle">Skin</text>
<text x="98.0" y="400.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">flushing, itching,</text>
<text x="98.0" y="418.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">urticaria pigmentosa,</text>
<text x="98.0" y="436.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">Darier sign</text>
<rect x="194.0" y="350" width="160" height="110" rx="12" fill="#fbe3d2" stroke="#b3541e" stroke-width="1.4"/>
<text x="274.0" y="376.0" font-size="14.5" font-weight="700" fill="#b3541e" text-anchor="middle">Gut</text>
<text x="274.0" y="400.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">abdominal pain,</text>
<text x="274.0" y="418.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">diarrhoea, ulcer</text>
<rect x="370.0" y="350" width="160" height="110" rx="12" fill="#f6d9dd" stroke="#a3223a" stroke-width="1.4"/>
<text x="450.0" y="376.0" font-size="14.5" font-weight="700" fill="#a3223a" text-anchor="middle">Circulation</text>
<text x="450.0" y="400.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">hypotension, syncope,</text>
<text x="450.0" y="418.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">anaphylaxis</text>
<rect x="546.0" y="350" width="160" height="110" rx="12" fill="#e3eaf6" stroke="#3d5fa8" stroke-width="1.4"/>
<text x="626.0" y="376.0" font-size="14.5" font-weight="700" fill="#3d5fa8" text-anchor="middle">Bone</text>
<text x="626.0" y="400.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">pain, osteoporosis,</text>
<text x="626.0" y="418.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">fractures</text>
<rect x="722.0" y="350" width="160" height="110" rx="12" fill="#e3f1e8" stroke="#2f7d4f" stroke-width="1.4"/>
<text x="802.0" y="376.0" font-size="14.5" font-weight="700" fill="#2f7d4f" text-anchor="middle">Marrow and organs</text>
<text x="802.0" y="400.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">cytopenias, spleen,</text>
<text x="802.0" y="418.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">liver (C findings)</text>
