<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif">
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b3540"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3223a"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f7d4f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d5fa8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8700f"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b3f8c"/></marker></defs>
<rect width="900" height="640" fill="#fff"/>
<text x="450" y="34.0" font-size="20" font-weight="700" fill="#1d1a24" text-anchor="middle">Telling the small B-cell lymphomas apart by CD5 and CD10</text>
<text x="450" y="56.0" font-size="13.5" font-weight="400" fill="#5d5663" text-anchor="middle">Start in the centre: CD10 first, then CD5, then the specific markers in the outer ring.</text>
<circle cx="320" cy="350" r="268" fill="#f1eff2" stroke="#5d5663" stroke-width="1.6"/>
<circle cx="320" cy="350" r="178" fill="#e3eaf6" stroke="#3d5fa8" stroke-width="1.6"/>
<circle cx="320" cy="350" r="66" fill="#e9e2f4" stroke="#5b3f8c" stroke-width="1.8"/>
<text x="320" y="326.0" font-size="15" font-weight="700" fill="#5b3f8c" text-anchor="middle">CD10+</text>
<text x="320" y="352.0" font-size="14" font-weight="700" fill="#1d1a24" text-anchor="middle">Follicular</text>
<text x="320" y="370.0" font-size="12" font-weight="400" fill="#5d5663" text-anchor="middle">t(14;18), BCL2</text>
<text x="320" y="210.0" font-size="15" font-weight="700" fill="#3d5fa8" text-anchor="middle">CD5+, CD10−</text>
<text x="198" y="334.0" font-size="14" font-weight="700" fill="#1d1a24" text-anchor="middle">Mantle cell</text>
<text x="198" y="352.0" font-size="12" font-weight="400" fill="#5d5663" text-anchor="middle">cyclin D1, SOX11</text>
<text x="198" y="368.0" font-size="12" font-weight="400" fill="#5d5663" text-anchor="middle">t(11;14)</text>
<text x="442" y="342.0" font-size="14" font-weight="700" fill="#1d1a24" text-anchor="middle">CLL/SLL</text>
<text x="442" y="360.0" font-size="12" font-weight="400" fill="#5d5663" text-anchor="middle">CD23+, CD200+</text>
<text x="320" y="120.0" font-size="15" font-weight="700" fill="#5d5663" text-anchor="middle">CD5−, CD10−</text>
<text x="95" y="342.0" font-size="14" font-weight="700" fill="#1d1a24" text-anchor="middle">Marginal</text>
<text x="95" y="360.0" font-size="14" font-weight="700" fill="#1d1a24" text-anchor="middle">zone</text>
<text x="320" y="562.0" font-size="14" font-weight="700" fill="#1d1a24" text-anchor="middle">Lymphoplasmacytic</text>
<text x="320" y="580.0" font-size="12" font-weight="400" fill="#5d5663" text-anchor="middle">MYD88 L265P</text>
<text x="545" y="342.0" font-size="14" font-weight="700" fill="#1d1a24" text-anchor="middle">Hairy cell</text>
<text x="545" y="360.0" font-size="14" font-weight="700" fill="#1d1a24" text-anchor="middle">leukaemia</text>
<rect x="605" y="90" width="280" height="530" rx="12" fill="#fff" stroke="#b8b1bd" stroke-width="1.3"/>
<text x="740" y="122.0" font-size="11" font-weight="700" fill="#5d5663" text-anchor="middle" letter-spacing="1.5">SECOND-LINE MARKERS</text>
<text x="623" y="158.0" font-size="14" font-weight="700" fill="#3d5fa8" text-anchor="start">CLL/SLL</text>
<text x="623" y="178.0" font-size="12.5" font-weight="400" fill="#5d5663" text-anchor="start">CD23 bright, CD200 bright, sIg and</text>
<text x="623" y="195.0" font-size="12.5" font-weight="400" fill="#5d5663" text-anchor="start">CD20 dim, FMC7−</text>
<text x="623" y="234.0" font-size="14" font-weight="700" fill="#3d5fa8" text-anchor="start">Mantle cell</text>
<text x="623" y="254.0" font-size="12.5" font-weight="400" fill="#5d5663" text-anchor="start">Cyclin D1 and SOX11; CD23−, CD200</text>
<text x="623" y="271.0" font-size="12.5" font-weight="400" fill="#5d5663" text-anchor="start">dim; sIg bright</text>
<text x="623" y="310.0" font-size="14" font-weight="700" fill="#5b3f8c" text-anchor="start">Follicular</text>
<text x="623" y="330.0" font-size="12.5" font-weight="400" fill="#5d5663" text-anchor="start">BCL6, CD10; BCL2 protein in</text>
<text x="623" y="347.0" font-size="12.5" font-weight="400" fill="#5d5663" text-anchor="start">follicles</text>
<text x="623" y="386.0" font-size="14" font-weight="700" fill="#1d1a24" text-anchor="start">Hairy cell</text>
<text x="623" y="406.0" font-size="12.5" font-weight="400" fill="#5d5663" text-anchor="start">CD11c, CD103, CD25, CD123, annexin</text>
<text x="623" y="423.0" font-size="12.5" font-weight="400" fill="#5d5663" text-anchor="start">A1, BRAF V600E</text>
<text x="623" y="462.0" font-size="14" font-weight="700" fill="#1d1a24" text-anchor="start">Marginal zone</text>
<text x="623" y="482.0" font-size="12.5" font-weight="400" fill="#5d5663" text-anchor="start">None specific; CD11c ±, 7q deletion</text>
<text x="623" y="499.0" font-size="12.5" font-weight="400" fill="#5d5663" text-anchor="start">in splenic type</text>
<text x="623" y="538.0" font-size="14" font-weight="700" fill="#1d1a24" text-anchor="start">Lymphoplasmacytic</text>
<text x="623" y="558.0" font-size="12.5" font-weight="400" fill="#5d5663" text-anchor="start">Plasmacytoid cells, IgM paraprotein,</text>
<text x="623" y="575.0" font-size="12.5" font-weight="400" fill="#5d5663" text-anchor="start">MYD88 L265P</text>
</svg>