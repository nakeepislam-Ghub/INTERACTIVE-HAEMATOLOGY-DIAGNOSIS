<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif">
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b3540"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3223a"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f7d4f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d5fa8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8700f"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b3f8c"/></marker></defs>
<rect width="900" height="560" fill="#fff"/>
<text x="450" y="34.0" font-size="19" font-weight="700" fill="#1d1a24" text-anchor="middle">Myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase fusions</text>
<text x="450" y="56.0" font-size="13" font-weight="400" fill="#5d5663" text-anchor="middle">A fused, always-on tyrosine kinase drives a stem cell clone; the partner gene sets the picture and the drug.</text>
<text x="110" y="92.0" font-size="12" font-weight="700" fill="#5d5663" text-anchor="middle">Kinase</text>
<text x="290" y="92.0" font-size="12" font-weight="700" fill="#5d5663" text-anchor="middle">Usual partner</text>
<text x="544" y="92.0" font-size="12" font-weight="700" fill="#5d5663" text-anchor="middle">Typical presentation</text>
<text x="800" y="92.0" font-size="12" font-weight="700" fill="#5d5663" text-anchor="middle">Response</text>
<rect x="30" y="104" width="160" height="50" rx="10" fill="#e3f1e8" stroke="#2f7d4f" stroke-width="1.4"/>
<text x="110" y="135.0" font-size="15" font-weight="700" fill="#2f7d4f" text-anchor="middle">PDGFRA</text>
<path d="M192 129 L206 129" fill="none" stroke="#3b3540" stroke-width="1.3" marker-end="url(#ak)"/>
<rect x="208" y="104" width="166" height="50" rx="8" fill="#fff" stroke="#b8b1bd" stroke-width="1.3"/>
<text x="291" y="125.0" font-size="11" font-weight="400" fill="#1d1a24" text-anchor="middle">FIP1L1</text>
<text x="291" y="142.0" font-size="11" font-weight="400" fill="#1d1a24" text-anchor="middle">cryptic 4q12 deletion</text>
<rect x="384" y="104" width="320" height="50" rx="8" fill="#fff" stroke="#b8b1bd" stroke-width="1.3"/>
<text x="544" y="134.0" font-size="11.5" font-weight="400" fill="#1d1a24" text-anchor="middle">Chronic eosinophilic picture, tryptase ↑, B12 ↑; men 7:1</text>
<rect x="710.0" y="118" width="180" height="22" rx="11" fill="#e3f1e8" stroke="#2f7d4f" stroke-width="1.1"/>
<text x="800" y="132.8" font-size="10.5" font-weight="700" fill="#2f7d4f" text-anchor="middle">Imatinib: excellent</text>
<rect x="30" y="166" width="160" height="50" rx="10" fill="#e3f1e8" stroke="#2f7d4f" stroke-width="1.4"/>
<text x="110" y="197.0" font-size="15" font-weight="700" fill="#2f7d4f" text-anchor="middle">PDGFRB</text>
<path d="M192 191 L206 191" fill="none" stroke="#3b3540" stroke-width="1.3" marker-end="url(#ak)"/>
<rect x="208" y="166" width="166" height="50" rx="8" fill="#fff" stroke="#b8b1bd" stroke-width="1.3"/>
<text x="291" y="196.0" font-size="12" font-weight="400" fill="#1d1a24" text-anchor="middle">ETV6, t(5;12)</text>
<rect x="384" y="166" width="320" height="50" rx="8" fill="#fff" stroke="#b8b1bd" stroke-width="1.3"/>
<text x="544" y="196.0" font-size="11.5" font-weight="400" fill="#1d1a24" text-anchor="middle">CMML with eosinophilia, MDS/MPN-N</text>
<rect x="710.0" y="180" width="180" height="22" rx="11" fill="#e3f1e8" stroke="#2f7d4f" stroke-width="1.1"/>
<text x="800" y="194.8" font-size="10.5" font-weight="700" fill="#2f7d4f" text-anchor="middle">Imatinib: excellent</text>
<rect x="30" y="228" width="160" height="50" rx="10" fill="#f6d9dd" stroke="#a3223a" stroke-width="1.4"/>
<text x="110" y="259.0" font-size="15" font-weight="700" fill="#a3223a" text-anchor="middle">FGFR1</text>
<path d="M192 253 L206 253" fill="none" stroke="#3b3540" stroke-width="1.3" marker-end="url(#ak)"/>
<rect x="208" y="228" width="166" height="50" rx="8" fill="#fff" stroke="#b8b1bd" stroke-width="1.3"/>
<text x="291" y="258.0" font-size="12" font-weight="400" fill="#1d1a24" text-anchor="middle">ZMYM2, t(8;13); 8p11</text>
<rect x="384" y="228" width="320" height="50" rx="8" fill="#fff" stroke="#b8b1bd" stroke-width="1.3"/>
<text x="544" y="258.0" font-size="11.5" font-weight="400" fill="#1d1a24" text-anchor="middle">T-lymphoblastic lymphoma + MPN, nodes, mediastinum</text>
<rect x="710.0" y="242" width="180" height="22" rx="11" fill="#f6d9dd" stroke="#a3223a" stroke-width="1.1"/>
<text x="800" y="256.8" font-size="10.5" font-weight="700" fill="#a3223a" text-anchor="middle">Resistant; pemigatinib, transplant</text>
<rect x="30" y="290" width="160" height="50" rx="10" fill="#fbeccb" stroke="#a8700f" stroke-width="1.4"/>
<text x="110" y="321.0" font-size="15" font-weight="700" fill="#a8700f" text-anchor="middle">JAK2</text>
<path d="M192 315 L206 315" fill="none" stroke="#3b3540" stroke-width="1.3" marker-end="url(#ak)"/>
<rect x="208" y="290" width="166" height="50" rx="8" fill="#fff" stroke="#b8b1bd" stroke-width="1.3"/>
<text x="291" y="320.0" font-size="12" font-weight="400" fill="#1d1a24" text-anchor="middle">PCM1, t(8;9)</text>
<rect x="384" y="290" width="320" height="50" rx="8" fill="#fff" stroke="#b8b1bd" stroke-width="1.3"/>
<text x="544" y="320.0" font-size="11.5" font-weight="400" fill="#1d1a24" text-anchor="middle">Eosinophilia, erythroid clusters, fibrosis</text>
<rect x="710.0" y="304" width="180" height="22" rx="11" fill="#fbeccb" stroke="#a8700f" stroke-width="1.1"/>
<text x="800" y="318.8" font-size="10.5" font-weight="700" fill="#a8700f" text-anchor="middle">Ruxolitinib briefly; transplant</text>
<rect x="30" y="352" width="160" height="50" rx="10" fill="#fbeccb" stroke="#a8700f" stroke-width="1.4"/>
<text x="110" y="383.0" font-size="15" font-weight="700" fill="#a8700f" text-anchor="middle">FLT3</text>
<path d="M192 377 L206 377" fill="none" stroke="#3b3540" stroke-width="1.3" marker-end="url(#ak)"/>
<rect x="208" y="352" width="166" height="50" rx="8" fill="#fff" stroke="#b8b1bd" stroke-width="1.3"/>
<text x="291" y="382.0" font-size="12" font-weight="400" fill="#1d1a24" text-anchor="middle">ETV6, t(12;13)</text>
<rect x="384" y="352" width="320" height="50" rx="8" fill="#fff" stroke="#b8b1bd" stroke-width="1.3"/>
<text x="544" y="382.0" font-size="11.5" font-weight="400" fill="#1d1a24" text-anchor="middle">MPN or T/B lymphoblastic, lytic lesions</text>
<rect x="710.0" y="366" width="180" height="22" rx="11" fill="#fbeccb" stroke="#a8700f" stroke-width="1.1"/>
<text x="800" y="380.8" font-size="10.5" font-weight="700" fill="#a8700f" text-anchor="middle">Aggressive; FLT3 inhibitors</text>
<rect x="30" y="414" width="160" height="50" rx="10" fill="#e3f1e8" stroke="#2f7d4f" stroke-width="1.4"/>
<text x="110" y="445.0" font-size="15" font-weight="700" fill="#2f7d4f" text-anchor="middle">ETV6::ABL1</text>
<path d="M192 439 L206 439" fill="none" stroke="#3b3540" stroke-width="1.3" marker-end="url(#ak)"/>
<rect x="208" y="414" width="166" height="50" rx="8" fill="#fff" stroke="#b8b1bd" stroke-width="1.3"/>
<text x="291" y="444.0" font-size="12" font-weight="400" fill="#1d1a24" text-anchor="middle">t(9;12), cryptic</text>
<rect x="384" y="414" width="320" height="50" rx="8" fill="#fff" stroke="#b8b1bd" stroke-width="1.3"/>
<text x="544" y="444.0" font-size="11.5" font-weight="400" fill="#1d1a24" text-anchor="middle">CML-like with eosinophilia, basophilia</text>
<rect x="710.0" y="428" width="180" height="22" rx="11" fill="#e3f1e8" stroke="#2f7d4f" stroke-width="1.1"/>
<text x="800" y="442.8" font-size="10.5" font-weight="700" fill="#2f7d4f" text-anchor="middle">ABL1 inhibitors: good</text>
<rect x="30" y="476" width="160" height="50" rx="10" fill="#fff" stroke="#b8b1bd" stroke-width="1.4"/>
<text x="110" y="507.0" font-size="15" font-weight="700" fill="#1d1a24" text-anchor="middle">Other TK</text>
<path d="M192 501 L206 501" fill="none" stroke="#3b3540" stroke-width="1.3" marker-end="url(#ak)"/>
<rect x="208" y="476" width="166" height="50" rx="8" fill="#fff" stroke="#b8b1bd" stroke-width="1.3"/>
<text x="291" y="497.0" font-size="11" font-weight="400" fill="#1d1a24" text-anchor="middle">ETV6::FGFR2, ::LYN, ::NTRK3</text>
<text x="291" y="514.0" font-size="11" font-weight="400" fill="#1d1a24" text-anchor="middle">RANBP2::ALK, BCR::RET</text>
<rect x="384" y="476" width="320" height="50" rx="8" fill="#fff" stroke="#b8b1bd" stroke-width="1.3"/>
<text x="544" y="506.0" font-size="11.5" font-weight="400" fill="#1d1a24" text-anchor="middle">Eosinophilia, monocytosis, spindled mast cells</text>
<rect x="710.0" y="490" width="180" height="22" rx="11" fill="#fff" stroke="#5d5663" stroke-width="1.1"/>
<text x="800" y="504.8" font-size="10.5" font-weight="700" fill="#5d5663" text-anchor="middle">Not well defined</text>
