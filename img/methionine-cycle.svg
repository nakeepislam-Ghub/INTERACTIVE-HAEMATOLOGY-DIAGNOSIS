<text x="590" y="446.0" font-size="14" font-weight="700" fill="#1d1a24" text-anchor="middle">B12 deficiency: the methyl-folate trap</text>
<text x="590" y="470.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">Folate is stuck as 5-methyl-THF, so DNA synthesis fails.</text>
<text x="590" y="489.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">Homocysteine rises in both deficiencies;</text>
<text x="590" y="508.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">methylmalonic acid rises only in B12 deficiency.</text>
