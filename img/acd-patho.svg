<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif">
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b3540"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3223a"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f7d4f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d5fa8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8700f"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b3f8c"/></marker></defs>
<rect width="880" height="470" fill="#fff"/>
<text x="440" y="34.0" font-size="20" font-weight="700" fill="#1d1a24" text-anchor="middle">Anaemia of chronic disease: three mechanisms</text>
<rect x="230.0" y="62.0" width="420" height="44" rx="10" fill="#fbe3d2" stroke="#b3541e" stroke-width="1.3"/>
<text x="440" y="89.1" font-size="14.5" font-weight="700" fill="#b3541e" text-anchor="middle">Chronic infection, autoimmune disease or cancer</text>
<rect x="270.0" y="132.0" width="340" height="40" rx="10" fill="#f6d9dd" stroke="#a3223a" stroke-width="1.3"/>
<text x="440" y="156.9" font-size="14" font-weight="700" fill="#a3223a" text-anchor="middle">Cytokines: IL-6, IL-1, TNF-α, interferon-γ</text>
<path d="M440 106 L440 130" fill="none" stroke="#3b3540" stroke-width="2" marker-end="url(#ak)"/>
<rect x="60" y="212" width="240" height="170" rx="12" fill="#fbeccb" stroke="#a8700f" stroke-width="1.4"/>
<text x="180" y="238.0" font-size="15" font-weight="700" fill="#a8700f" text-anchor="middle">Hepcidin rises (IL-6)</text>
<text x="180" y="264.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">ferroportin destroyed</text>
<text x="180" y="284.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">iron locked in macrophages</text>
<text x="180" y="304.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">less iron absorbed</text>
<rect x="66.60000000000001" y="339" width="226.79999999999998" height="22" rx="11" fill="#fff" stroke="#a8700f" stroke-width="1.1"/>
<text x="180" y="354.3" font-size="12" font-weight="700" fill="#a8700f" text-anchor="middle">Iron-restricted erythropoiesis</text>
<path d="M440 172 L180 208" fill="none" stroke="#3b3540" stroke-width="1.8" marker-end="url(#ak)"/>
<rect x="320" y="212" width="240" height="170" rx="12" fill="#e3eaf6" stroke="#3d5fa8" stroke-width="1.4"/>
<text x="440" y="238.0" font-size="15" font-weight="700" fill="#3d5fa8" text-anchor="middle">EPO is blunted</text>
<text x="440" y="264.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">less EPO made</text>
<text x="440" y="284.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">marrow responds</text>
<text x="440" y="304.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">poorly to EPO</text>
<rect x="357.92" y="339" width="164.16" height="22" rx="11" fill="#fff" stroke="#3d5fa8" stroke-width="1.1"/>
<text x="440" y="354.3" font-size="12" font-weight="700" fill="#3d5fa8" text-anchor="middle">Too few new red cells</text>
<path d="M440 172 L440 208" fill="none" stroke="#3b3540" stroke-width="1.8" marker-end="url(#ak)"/>
<rect x="580" y="212" width="240" height="170" rx="12" fill="#e9e2f4" stroke="#5b3f8c" stroke-width="1.4"/>
<text x="700" y="238.0" font-size="15" font-weight="700" fill="#5b3f8c" text-anchor="middle">Red cells live less</text>
<text x="700" y="264.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">activated macrophages</text>
<text x="700" y="284.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">clear red cells</text>
<text x="700" y="304.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">earlier</text>
<rect x="604.0" y="339" width="192.0" height="22" rx="11" fill="#fff" stroke="#5b3f8c" stroke-width="1.1"/>
<text x="700" y="354.3" font-size="12" font-weight="700" fill="#5b3f8c" text-anchor="middle">Mildly shortened survival</text>
<path d="M440 172 L700 208" fill="none" stroke="#3b3540" stroke-width="1.8" marker-end="url(#ak)"/>
<rect x="60" y="400" width="760" height="52" rx="10" fill="#f6d9dd" stroke="#a3223a" stroke-width="1.3"/>
<text x="440" y="422.0" font-size="14.5" font-weight="700" fill="#a3223a" text-anchor="middle">Normocytic (later microcytic) anaemia</text>
<text x="440" y="442.0" font-size="13" font-weight="400" fill="#1d1a24" text-anchor="middle">low serum iron, low TIBC, normal or high ferritin</text>
</svg>