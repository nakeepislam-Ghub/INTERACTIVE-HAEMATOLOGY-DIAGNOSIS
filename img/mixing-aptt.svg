<text x="278.0" y="642.0" font-size="13.5" font-weight="700" fill="#a3223a" text-anchor="middle">Factor VIII or V</text>
<text x="278.0" y="658.9" font-size="13.5" font-weight="700" fill="#a3223a" text-anchor="middle">(PT long → V)</text>
<path d="M278.0 397.0 V440.0 H450.0 V481.0" fill="none" stroke="#3b3540" stroke-width="1.6" marker-end="url(#ak)"/>
<rect x="397.645" y="443.0" width="104.71" height="22" rx="11" fill="#fff" stroke="#a3223a" stroke-width="1.1"/>
<text x="450.0" y="458.1" font-size="11.5" font-weight="700" fill="#a3223a" text-anchor="middle">No correction</text>
<rect x="371.0" y="483.0" width="158.0" height="54" rx="9" fill="#f6d9dd" stroke="#a3223a" stroke-width="1.3"/>
<text x="450.0" y="502.0" font-size="13.5" font-weight="700" fill="#a3223a" text-anchor="middle">Factor IX, X or II</text>
<text x="450.0" y="518.9" font-size="13.5" font-weight="700" fill="#a3223a" text-anchor="middle">(PT normal → IX)</text>
<path d="M364.0 257.0 V300.0 H622.0 V341.0" fill="none" stroke="#3b3540" stroke-width="1.6" marker-end="url(#ak)"/>
<rect x="569.645" y="303.0" width="104.71" height="22" rx="11" fill="#fff" stroke="#a3223a" stroke-width="1.1"/>
<text x="622.0" y="318.1" font-size="11.5" font-weight="700" fill="#a3223a" text-anchor="middle">No correction</text>
<rect x="543.0" y="343.0" width="158.0" height="54" rx="9" fill="#f6d9dd" stroke="#a3223a" stroke-width="1.3"/>
<text x="622.0" y="362.0" font-size="13.5" font-weight="700" fill="#a3223a" text-anchor="middle">Time-dependent</text>
<text x="622.0" y="378.9" font-size="13.5" font-weight="700" fill="#a3223a" text-anchor="middle">inhibitor (FVIII)</text>
<path d="M450.0 117.0 V160.0 H794.0 V201.0" fill="none" stroke="#3b3540" stroke-width="1.6" marker-end="url(#ak)"/>
<rect x="741.645" y="163.0" width="104.71" height="22" rx="11" fill="#fff" stroke="#a3223a" stroke-width="1.1"/>
<text x="794.0" y="178.1" font-size="11.5" font-weight="700" fill="#a3223a" text-anchor="middle">No correction</text>
<rect x="715.0" y="203.0" width="158.0" height="54" rx="9" fill="#f6d9dd" stroke="#a3223a" stroke-width="1.3"/>
<text x="794.0" y="222.0" font-size="13.5" font-weight="700" fill="#a3223a" text-anchor="middle">Immediate inhibitor</text>
<text x="794.0" y="238.9" font-size="13.5" font-weight="700" fill="#a3223a" text-anchor="middle">(lupus anticoagulant)</text>
<text x="450" y="742.0" font-size="12.5" font-weight="400" fill="#5d5663" text-anchor="middle">Adsorbed plasma keeps I, V, VIII, XI, XII; aged plasma keeps all factors except V and VIII. The missing factor is one the corrector supplies.</text>
</svg>