<text x="150" y="262.0" font-size="11.5" font-weight="400" fill="#1d1a24" text-anchor="middle">e.g. CD19+CD10+ and MPO+ on the same cell</text>
<text x="450" y="262.0" font-size="11.5" font-weight="400" fill="#1d1a24" text-anchor="middle">e.g. B lymphoblasts plus myeloblasts</text>
<text x="750" y="262.0" font-size="11.5" font-weight="400" fill="#1d1a24" text-anchor="middle">CD34, HLA-DR, CD38 only; MPO −</text>
<circle cx="330" cy="283" r="6" fill="#7aa0d8" stroke="#1d1a24"/>
<text x="340" y="287.0" font-size="11.5" font-weight="400" fill="#5d5663" text-anchor="start">B-lineage marker</text>
<circle cx="470" cy="283" r="6" fill="#e08a8a" stroke="#1d1a24"/>
<text x="480" y="287.0" font-size="11.5" font-weight="400" fill="#5d5663" text-anchor="start">myeloid marker</text>
<rect x="20" y="316" width="860" height="204" rx="12" fill="#fff" stroke="#b8b1bd" stroke-width="1.3"/>
<text x="450" y="342.0" font-size="15" font-weight="700" fill="#1d1a24" text-anchor="middle">WHO 2022 lineage-assignment criteria</text>
<rect x="80.0" y="359" width="170" height="22" rx="11" fill="#fff" stroke="#3d5fa8" stroke-width="1.1"/>
<text x="165" y="374.7" font-size="13" font-weight="700" fill="#3d5fa8" text-anchor="middle">B lineage</text>
<text x="165" y="400.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">CD19 strong + 1 of CD10,</text>
<text x="165" y="419.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">CD22, CD79a strong</text>
<text x="165" y="438.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">or CD19 weak + 2 of them</text>
<text x="165" y="457.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">(CD79a not used if T is possible)</text>
<rect x="365.0" y="359" width="170" height="22" rx="11" fill="#fff" stroke="#2f7d4f" stroke-width="1.1"/>
<text x="450" y="374.7" font-size="13" font-weight="700" fill="#2f7d4f" text-anchor="middle">T lineage</text>
<text x="450" y="400.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">cytoplasmic or surface CD3</text>
<text x="450" y="419.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">brighter than 50% of normal</text>
<text x="450" y="438.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">mature T cells</text>
<text x="450" y="457.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">(or IHC, non-zeta antibody)</text>
<rect x="650.0" y="359" width="170" height="22" rx="11" fill="#fff" stroke="#a3223a" stroke-width="1.1"/>
<text x="735" y="374.7" font-size="13" font-weight="700" fill="#a3223a" text-anchor="middle">Myeloid lineage</text>
<text x="735" y="400.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">MPO above 50% of the</text>
<text x="735" y="419.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">mature neutrophil level</text>
<text x="735" y="438.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">or ≥2 monocytic markers:</text>
<text x="735" y="457.0" font-size="12.5" font-weight="400" fill="#1d1a24" text-anchor="middle">NSE, CD11c, CD14, CD64, lysozyme</text>
<text x="450" y="500.0" font-size="12.5" font-weight="700" fill="#5d5663" text-anchor="middle">Aberrant single markers (CD13/CD33 on ALL, CD7/CD19 on AML) are common and do not make MPAL.</text>
