<rect width="900" height="540" fill="#fff"/>
<text x="450" y="34.0" font-size="19" font-weight="700" fill="#1d1a24" text-anchor="middle">Acute leukaemias of ambiguous lineage: how the blasts declare themselves</text>
<text x="450" y="56.0" font-size="13.5" font-weight="400" fill="#5d5663" text-anchor="middle">At least 20% blasts that do not commit to one lineage. Flow cytometry assigns lineage.</text>
<rect x="12" y="76" width="276" height="220" rx="14" fill="#e9e2f4" stroke="#5b3f8c" stroke-width="1.4"/>
<text x="150" y="102.0" font-size="15.5" font-weight="700" fill="#5b3f8c" text-anchor="middle">Biphenotypic MPAL</text>
<text x="150" y="121.0" font-size="12.5" font-weight="400" fill="#5d5663" text-anchor="middle">one population, two lineages</text>
<rect x="312" y="76" width="276" height="220" rx="14" fill="#e3eaf6" stroke="#3d5fa8" stroke-width="1.4"/>
<text x="450" y="102.0" font-size="15.5" font-weight="700" fill="#3d5fa8" text-anchor="middle">Bilineal MPAL</text>
<text x="450" y="121.0" font-size="12.5" font-weight="400" fill="#5d5663" text-anchor="middle">two populations, one lineage each</text>
<rect x="612" y="76" width="276" height="220" rx="14" fill="#f1eff2" stroke="#5d5663" stroke-width="1.4"/>
<text x="750" y="102.0" font-size="15.5" font-weight="700" fill="#5d5663" text-anchor="middle">Undifferentiated (AUL)</text>
<text x="750" y="121.0" font-size="12.5" font-weight="400" fill="#5d5663" text-anchor="middle">no lineage marker at all</text>
